function probe(x,y,r){

  if(x+r>q.l&&x-r<q.r&&y+r>q.t){const pu=y+r-q.t;let nx=0,ny=-1,pen=pu;
   if(pu<=SH+r+2){const pl=x+r-q.l,pr=q.r-(x-r);if(pl<pen){pen=pl;nx=-1;ny=0}if(pr<pen){pen=pr;nx=1;ny=0}}
   if(!best||pen<best.pen)best={nx,ny,pen,j}}}
 return best}

 const sc=$('panel').scrollTop;

  return`<div class="card ${mx?'lock':''}"><div class="ic">${q.i}</div><div class="tx"><b>${q.n}</b> <span class="lv">${q.k=='pack'?'queued '+l:q.m?l+'/'+q.m:'Lv '+l}</span><br><small>${q.d}</small></div><button data-b="${q.id}" ${can?'':'disabled'}>${mx?'MAX':'$'+fmt(c)}</button></div>`}).join('');
  if(hid)h+=`<p class="lv" style="text-align:center">🔒 ${hid} more upgrades unlock as you earn</p>`}
 if(tab=='ab'){h+=`<p class="lv">Choose what SPACE (or tapping) does while he is falling. Every use costs one charge, and you get ${2+ST.charges} charges per run (buy Extra Charges for more).</p>`+ABIL.map(([id,n2,ic,d,c])=>{const own=S.abil[id],eq=S.eq==id;
   return`<div class="card ${eq||own||c<=S.cash?'':'lock'}" style="${eq?'border-left-color:#35c866':''}"><div class="ic">${ic}</div><div class="tx"><b>${n2}</b>${eq?' <span class="lv">EQUIPPED</span>':''}<br><small>${d}</small></div><button data-ab="${id}" ${eq||(!own&&c>S.cash)?'disabled':''}>${eq?'ON':own?'Equip':'$'+fmt(c)}</button></div>`}).join('')}
